<p>Pumpkin Soup <br>
   Ingredients: <br>
Pumpkin <br>
Onion <br>
Water <br>
Salt and Pepper <br>
   Method to the recipe: <br>
Cut the pumpkin and onion into small pieces. <br>
Boil them in water until soft. <br>
Blend everything together and add salt and pepper. </p>
